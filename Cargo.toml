[package]
name = "tau"
version = "0.1.0"
edition = "2021"
description = "Tau: a low-level, math/science-focused programming language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pigeon318/Tau"

[lib]
name = "tau"
path = "src/lib.rs"

[[bin]]
name = "tau"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
