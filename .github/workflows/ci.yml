name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (interpreter and native backend)
        run: cargo test --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # the native backend needs a C compiler: MinGW-w64 gcc (UCRT) from MSYS2
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put gcc on the PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Show the toolchain
        shell: pwsh
        run: |
          gcc --version
          rustc --version
      - name: Test (interpreter and native backend)
        shell: pwsh
        run: cargo test --release
      - name: Build tau.exe
        shell: pwsh
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tau-windows-x86_64
          path: target/release/tau.exe
