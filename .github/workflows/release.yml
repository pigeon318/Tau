name: release

# Publishes tau.exe (Windows) and tau (Linux) when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tau-windows-x86_64
          path: target/release/tau.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tau-linux-x86_64
          path: target/release/tau

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag must match the version in Cargo.toml, because `tau update` compares them
          want="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "the tag is ${GITHUB_REF_NAME} but Cargo.toml says $want"
            exit 1
          fi
          cd dist
          cp tau-windows-x86_64/tau.exe tau-windows-x86_64.exe
          cp tau-linux-x86_64/tau tau-linux-x86_64
          chmod +x tau-linux-x86_64
          # the file names and SHA256SUMS are what `tau update` looks for
          sha256sum tau-windows-x86_64.exe tau-linux-x86_64 > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Tau ${GITHUB_REF_NAME}" --generate-notes tau-windows-x86_64.exe tau-linux-x86_64 SHA256SUMS
